name: OpenRocket simulation check

# Runs on EVERY push (any branch, no pull request needed) that touches an
# OpenRocket design, a motor thrust curve, or the simulation config. Each
# changed .ork is simulated before and after the push, and a before/after
# table is posted as a comment on the commit, in the job summary, and as a
# downloadable artifact. See tools/openrocket/CI.md.
on:
  push:
    paths:
      - "aero_modeling/**/*.ork"
      - "aero_modeling/**/*.rse"
      - "aero_modeling/**/*.eng"
      - "aero_modeling/**/*.csv"
      - "aero_modeling/**/*.CDX1"
      - "aero_modeling/whatif_config.json"
      - "tools/whatif/**"
      - "aero_modeling/sim_config.json"
      - "tools/openrocket/or_ci.py"
      - "tools/openrocket/tests/**"
      - ".github/workflows/openrocket-sim.yml"
  workflow_dispatch:
    inputs:
      base:
        description: "Base commit/ref to compare against (empty = previous commit)"
        required: false
        default: ""
      all:
        description: "Simulate every configured .ork, not just changed ones"
        type: boolean
        default: false

permissions:
  contents: write   # needed to post commit comments with GITHUB_TOKEN
  pages: write      # GitHub Pages deployment (history site)
  id-token: write   # required by actions/deploy-pages

concurrency:
  group: openrocket-sim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out (full history, so the base commit is available)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Java 17 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"

      - name: Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tools/openrocket/requirements.txt

      - name: Install orlab
        run: pip install -r tools/openrocket/requirements.txt

      - name: Cache the OpenRocket jar
        uses: actions/cache@v6
        with:
          path: ~/.cache/orlab-jars
          key: openrocket-jar-24.12

      - name: Fetch OpenRocket 24.12 (verified download, cached across runs)
        run: python -m orlab fetch 24.12

      # Per-version simulation results, design diffs and AI narrations, keyed by git blob id.
      - name: Restore the history cache
        uses: actions/cache@v6
        with:
          path: .or_ci_cache
          key: openrocket-history-${{ github.sha }}
          restore-keys: |
            openrocket-history-

      - name: Simulate before/after and diff the designs
        id: sim
        env:
          BASE: ${{ github.event.before || inputs.base }}
          ALL: ${{ inputs.all == true && '--all' || '' }}
        run: |
          python tools/openrocket/or_ci.py compare \
            --config aero_modeling/sim_config.json \
            --base "$BASE" $ALL \
            --results or_ci_results \
            --cache .or_ci_cache \
            --quiet

      - name: Performance history (Mermaid charts) for the changed designs
        if: always() && hashFiles('or_ci_results/targets.txt') != ''
        run: |
          targets=$(tr '\n' ' ' < or_ci_results/targets.txt)
          if [ -n "$(echo $targets | tr -d ' ')" ]; then
            python tools/openrocket/or_ci.py history \
              --config aero_modeling/sim_config.json \
              --cache .or_ci_cache \
              --results or_ci_results/history \
              --pending or_ci_results/pending \
              --quiet $targets
          fi

      # ---- optional: GitHub Copilot writes a short plain-English summary of each design change ----
      # Enabled by adding a repository secret COPILOT_GITHUB_TOKEN: a fine-grained personal access
      # token with the "Copilot Requests" permission, from an account with a Copilot subscription.
      # Without the secret these steps are skipped and the report carries the exact diff only.
      - name: Is the Copilot narrator configured?
        id: copilot
        if: always()
        env:
          TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: echo "enabled=$([ -n "$TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

      - name: Node (for Copilot CLI)
        if: always() && steps.copilot.outputs.enabled == 'true' && hashFiles('or_ci_results/pending/*.prompt.md') != ''
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Copilot narrates the design changes
        if: always() && steps.copilot.outputs.enabled == 'true' && hashFiles('or_ci_results/pending/*.prompt.md') != ''
        continue-on-error: true          # a narration problem must never fail the simulation check
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          npm install -g @github/copilot
          repo="$PWD"
          work="$(mktemp -d)"            # empty folder: the agent may only write files, and only here
          for p in "$repo"/or_ci_results/pending/*.prompt.md; do
            key="$(basename "$p" .prompt.md)"
            prompt="$(cat "$p")"
            ( cd "$work" && timeout 240 copilot -p "$prompt" --allow-tool=write --no-ask-user ) \
              || echo "::warning::Copilot narration failed for $key"
            if [ -s "$work/$key.out.md" ]; then cp "$work/$key.out.md" "$repo/or_ci_results/pending/"; fi
          done

      - name: Assemble the report (merges any narrations)
        if: always() && hashFiles('or_ci_results/results.json') != ''
        run: |
          python tools/openrocket/or_ci.py narrate \
            --config aero_modeling/sim_config.json \
            --results or_ci_results \
            --cache .or_ci_cache \
            --summary "$GITHUB_STEP_SUMMARY" \
            --quiet
          if [ -f or_ci_results/history/history.md ]; then cat or_ci_results/history/history.md >> "$GITHUB_STEP_SUMMARY"; fi

      - name: Build the history site for every design (main only)
        if: always() && github.ref == 'refs/heads/main'
        run: |
          python tools/openrocket/or_ci.py history \
            --config aero_modeling/sim_config.json \
            --cache .or_ci_cache \
            --results or_ci_results/site_history \
            --narrate-backlog 0 \
            --site site \
            --repo-url "${{ github.server_url }}/${{ github.repository }}" \
            --quiet

      # ---- Predictions page: the committed design flown on the committed RASAero table (tools/whatif/README.md) ----
      # Needs the flight_sim package (it holds the .ork reader, the page template and the 6-DOF sim).
      # FLIGHT_SIM_REPO / FLIGHT_SIM_REF are optional repository variables; FLIGHT_SIM_TOKEN is only
      # needed while that repo is private. If the checkout fails the rest of the site still deploys.
      - name: Check out flight_sim (for the predictions page)
        id: flightsim
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        uses: actions/checkout@v7
        with:
          repository: ${{ vars.FLIGHT_SIM_REPO || 'tamusrt/flight_sim' }}
          ref: ${{ vars.FLIGHT_SIM_REF || 'main' }}
          token: ${{ secrets.FLIGHT_SIM_TOKEN || github.token }}
          path: flight_sim_src

      - name: Build the predictions page (main only)
        id: predictions
        if: always() && github.ref == 'refs/heads/main' && steps.flightsim.outcome == 'success'
        continue-on-error: true          # a predictions-page problem must never block the history site
        run: |
          pip install ./flight_sim_src
          python tools/whatif/build_site.py --config aero_modeling/whatif_config.json --site site

      # ---- Real-browser check of the built site, before it goes live ----
      # Opens the site in Chromium and clicks through History, Predictions and Vision (tools/whatif/tests/browser_test.py).
      # If the predictions build above worked, the Predictions page and Vision must be there and working; if it
      # did not (for example flight_sim could not be checked out), only the History tab is checked here.
      # This step may fail without stopping the run: the step after it decides what to do about it.
      - name: Install the browser for the check (main only)
        if: always() && github.ref == 'refs/heads/main' && hashFiles('site/index.html') != ''
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Click through the built site in a real browser (main only)
        id: browser
        if: always() && github.ref == 'refs/heads/main' && hashFiles('site/index.html') != ''
        continue-on-error: true
        env:
          REQUIRE: ${{ steps.predictions.outcome == 'success' && '--require-predictions' || '' }}
        run: python tools/whatif/tests/browser_test.py --site site --shots browser_test_pictures --report browser_report.json $REQUIRE

      # ---- If this push broke Predictions or Vision, the site keeps showing the last good ones ----
      # Takes the Predictions page and Vision that are live now and puts them in the site in place of the broken
      # new ones, and writes build_status.json, which makes the History page show a large red Error bar at the top
      # saying what broke (tools/whatif/site_status.py). The site is still published. A problem in the History
      # tab itself fails this step: nothing is published, and the site that is live now stays as it is.
      # LIVE_SITE_URL is an optional repository variable, for a site that is not at <owner>.github.io/<repo>.
      - name: Keep the last good Predictions and Vision if this push broke them (main only)
        id: status
        if: always() && github.ref == 'refs/heads/main' && hashFiles('site/index.html') != ''
        env:
          LIVE_URL: ${{ vars.LIVE_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          python tools/whatif/site_status.py --site site --config aero_modeling/whatif_config.json \
            --live-url "$LIVE_URL" \
            --flightsim "${{ steps.flightsim.outcome }}" --predictions "${{ steps.predictions.outcome }}" \
            --browser "${{ steps.browser.outcome }}" --report browser_report.json \
            --commit "${{ github.sha }}" \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      # ---- The JARVIS message: a picture of the whole flight in VISION, the apogees and any warnings ----
      # (tools/whatif/vision_shot.py and jarvis_note.py). The picture is published with the site as
      # predictions/vision.png. A problem here never stops the site from going live.
      - name: Take the VISION picture and write the JARVIS message (main only)
        if: always() && github.ref == 'refs/heads/main' && steps.predictions.outcome == 'success' && hashFiles('site/index.html') != ''
        continue-on-error: true
        env:
          LIVE_URL: ${{ vars.LIVE_SITE_URL || format('https://{0}.github.io/{1}', github.repository_owner, github.event.repository.name) }}
        run: |
          python tools/whatif/vision_shot.py --site site --out site/predictions/vision.png || echo "::warning title=No VISION picture::the JARVIS message goes out without it"
          pic=""
          if [ -f site/predictions/vision.png ]; then pic="--picture"; fi
          fs="${{ vars.FLIGHT_SIM_REF || 'main' }}@$(git -C flight_sim_src rev-parse --short HEAD)"
          python tools/whatif/jarvis_note.py --site site --live-url "$LIVE_URL" --flightsim "$fs" --out jarvis_note.md $pic --stamp "${GITHUB_SHA::7}"

      - name: Keep the pictures the browser test took
        if: always() && hashFiles('browser_test_pictures/*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-pictures-${{ github.sha }}
          path: browser_test_pictures/

      - name: Upload the site for GitHub Pages
        if: always() && github.ref == 'refs/heads/main' && hashFiles('site/index.html') != '' && steps.status.outcome != 'failure'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Upload results (CSV / JSON / report / history)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: openrocket-sim-${{ github.sha }}
          path: or_ci_results/
          if-no-files-found: ignore

      - name: Comment on the commit
        if: always() && github.event_name == 'push' && hashFiles('or_ci_results/report.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            python - <<'PY'
          import json, pathlib
          status = pathlib.Path("site/build_status.json")
          if status.is_file():
              for problem in json.loads(status.read_text(encoding="utf-8")).get("problems", []):
                  print(f"**ERROR ({problem['area']}):** {problem['message']}\n")
          PY
            cat or_ci_results/report.md
            echo
            if [ -f or_ci_results/history/history.md ]; then cat or_ci_results/history/history.md; echo; fi
            echo "_[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) · results CSV/JSON and full history CSV in the run's artifacts._"
          } > comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@comment.md >/dev/null

      # Its own message, separate from the OpenRocket one. With a Discord webhook (repository secret
      # DISCORD_WEBHOOK_URL, tools/whatif/README.md) it goes straight to the channel with the VISION picture;
      # without one it is a commit comment, which the Discord GitHub bot shows as text.
      - name: Send the JARVIS message
        if: always() && hashFiles('jarvis_note.md') != ''
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -n "$DISCORD_WEBHOOK_URL" ]; then
            if python tools/whatif/discord_post.py --note jarvis_note.json --picture site/predictions/vision.png; then exit 0; fi
            echo "::warning title=Discord post failed::sending the JARVIS message as a commit comment instead"
          fi
          {
            cat jarvis_note.md
            echo
            echo "_[Workflow run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})_"
          } > note_comment.md
          gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@note_comment.md >/dev/null

  # Regression test of the site page: builds a site from synthetic data (no OpenRocket) and runs the
  # page's JavaScript with assertions, then renders it through the real Plotly. A broken page blocks
  # the Pages deployment but not the simulation report above.
  page-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install jsdom and Plotly for the render check
        run: npm install --prefix tools/openrocket --no-package-lock --no-audit --no-fund
      - name: Test the site page
        run: python tools/openrocket/tests/test_site.py
      - name: Test the predictions build script and the Update CSV helper
        run: |
          python tools/whatif/tests/test_build_site.py
          python tools/whatif/tests/test_local_helper.py
          python tools/whatif/tests/test_site_status.py
      # The same click-through as above, on a made-up History site (no OpenRocket needed), so every
      # push to any branch checks the History page, its tabs and the Jarvis lines in a real browser.
      - name: Install the browser for the click-through
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Click through a made-up site in a real browser
        run: python tools/whatif/tests/browser_test.py --synthetic --shots browser_test_pictures
      - name: Keep the pictures the browser test took
        if: always() && hashFiles('browser_test_pictures/*.png') != ''
        uses: actions/upload-artifact@v7
        with:
          name: browser-test-pictures-synthetic-${{ github.sha }}
          path: browser_test_pictures/

  # Publishes the site built above. Runs only for pushes to main; the URL is shown on the run
  # and under Settings -> Pages. Pages must be set to "GitHub Actions" as the source (once).
  deploy-pages:
    needs: [simulate, page-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
