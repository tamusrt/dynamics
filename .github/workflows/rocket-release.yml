name: Rocket milestone release

# Publishes a GitHub Release of a rocket's aero_modeling/<ROCKET>/ folder when a
# commit pushed to main contains a directive in its message:
#
#   [release: SOL_INVICTUS/v1.2]
#
# The rocket name must match a folder in aero_modeling/ (case-insensitive). The
# release is tagged <ROCKET>/<milestone> on the commit that carried the
# directive, and the zip holds that folder exactly as committed there. Spaces in
# the milestone become underscores ("Design Freeze" -> Design_Freeze), since a
# tag cannot hold one. Every commit in the push is scanned, so directives
# survive merge commits, and one push may release several rockets.
#
# A "[release:" that does not read as [release: ROCKET/milestone] fails the run,
# so a typo never passes as "no directive". An existing tag is an error, never an
# overwrite: bump the milestone, or (when its release was deleted) delete the tag.
on:
  push:
    branches:
      - main

permissions:
  contents: write   # create tags and releases with GITHUB_TOKEN

concurrency:
  group: rocket-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # full history, to scan the pushed commits and check tags

      - name: Create releases from commit directives
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail

          # Commits in this push, oldest first. A new branch or a force push has
          # no usable "before", so fall back to the head commit alone.
          if [[ "$BEFORE" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            COMMITS="$AFTER"
          else
            COMMITS=$(git rev-list --reverse "$BEFORE..$AFTER")
          fi

          # [release: ROCKET/milestone], any case; the parts are checked one by one below so a bad one gets a message
          shopt -s nocasematch
          directive='\[release:([^]/]*)/([^]]*)\]'
          trim() { sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//'; }
          released=0

          for sha in $COMMITS; do
            msg=$(git log -1 --format=%B "$sha")
            [[ "$msg" == *"[release:"* ]] || continue
            if ! [[ "$msg" =~ $directive ]]; then
              echo "::error::Commit ${sha:0:7} has a [release: ...] that does not read as [release: ROCKET/milestone]. Nothing was released."
              exit 1
            fi
            requested=$(printf '%s' "${BASH_REMATCH[1]}" | trim)
            milestone=$(printf '%s' "${BASH_REMATCH[2]}" | trim | sed 's/[[:space:]]\{1,\}/_/g')   # a tag holds no spaces
            if ! [[ "$requested" =~ ^[A-Za-z0-9_-]+$ && "$milestone" =~ ^[A-Za-z0-9._-]+$ ]]; then
              echo "::error::Commit ${sha:0:7}: '[release: $requested/$milestone]' may only use letters, digits, '.', '_' and '-' (and spaces in the milestone). Nothing was released."
              exit 1
            fi

            # Resolve the folder name case-insensitively as it exists at that commit.
            rocket=$(git ls-tree -d --name-only "$sha" aero_modeling/ \
                     | sed 's|^aero_modeling/||' \
                     | grep -ix -- "$requested" || true)
            if [[ -z "$rocket" ]]; then
              echo "::error::Commit ${sha:0:7} asks to release '$requested', but aero_modeling/$requested does not exist there."
              exit 1
            fi

            tag="$rocket/$milestone"
            if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
              at=$(git rev-list -n 1 "refs/tags/$tag" | cut -c1-7)
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "::error::Release $tag already exists (commit $at). Use a new milestone name."
              else   # its release was deleted, the tag was not
                echo "::error::Tag $tag already exists (commit $at) but has no release: it was deleted. To release it again, delete the tag (git push origin :refs/tags/$tag) and push the directive again, or use a new milestone name."
              fi
              exit 1
            fi

            # Zip only tracked files at that commit, inside a top-level folder.
            zip_name="${rocket}_${milestone}.zip"
            git archive --format=zip --prefix="${rocket}_${milestone}/" \
              -o "$zip_name" "$sha:aero_modeling/$rocket"
            zip -dq "$zip_name" '*.DS_Store' '*/.gitkeep' || true   # no match is fine

            {
              echo "Milestone release of **$rocket**: \`$milestone\`"
              echo
              echo "Contents of \`aero_modeling/$rocket/\` at commit $sha."
              echo
              echo "Commit message:"
              echo
              echo '```'
              echo "$msg"
              echo '```'
            } > notes.md

            gh release create "$tag" "$zip_name" \
              --target "$sha" \
              --title "$rocket $milestone" \
              --notes-file notes.md

            echo "Released $tag from ${sha:0:7}" >> "$GITHUB_STEP_SUMMARY"
            released=$((released + 1))
          done

          if [[ $released -eq 0 ]]; then
            echo "No [release: ROCKET/milestone] directive in this push."
          fi
