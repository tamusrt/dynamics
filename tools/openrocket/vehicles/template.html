<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle side views</title>
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --accent:#0969da; --accent-soft: rgba(9,105,218,.12);
    /* kind hues: light tints in the drawing, outlined tags in the tree */
    --k-nose:#c97a3a; --k-tube:#5b86b8; --k-transition:#7f9a4f; --k-fin:#b9972e; --k-struct:#3a8f98; --k-mass:#8a6bbf; --k-reco:#3f9a5a; --k-stage:#1f2328; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --accent:#58a6ff; --accent-soft: rgba(88,166,255,.16);
      --k-nose:#e09a5a; --k-tube:#7fa6d8; --k-transition:#a3bb6f; --k-fin:#d9bb55; --k-struct:#5fbcc4; --k-mass:#ac92d8; --k-reco:#66bf7d; --k-stage:#e6edf3; }
  }
  .k-nose { --k: var(--k-nose); } .k-tube { --k: var(--k-tube); } .k-transition { --k: var(--k-transition); } .k-fin { --k: var(--k-fin); }
  .k-struct { --k: var(--k-struct); } .k-mass { --k: var(--k-mass); } .k-reco { --k: var(--k-reco); } .k-stage { --k: var(--k-stage); }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--fg); }
  body { font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji"; padding: 12px 20px 28px; }
  main { width: 100%; }
  h1 { font-size: 18px; font-weight: 600; margin: 0 14px 0 0; }
  /* toolbar */
  .bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
  .bar label { color: var(--muted); }
  .bar .grp { display: inline-flex; align-items: center; gap: 6px; }
  select { font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 3px 26px 3px 8px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { font: inherit; color: var(--muted); background: var(--bg); border: 0; padding: 3px 10px; cursor: pointer; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button.on { color: var(--fg); background: var(--card); font-weight: 600; }
  .chk { display: inline-flex; align-items: center; gap: 5px; color: var(--muted); cursor: pointer; user-select: none; }
  .chk input { margin: 0; accent-color: var(--accent); }
  .btn { font: inherit; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; margin-left: auto; }
  .btn:hover { color: var(--fg); }
  .built { color: var(--muted); font-size: 12px; }
  /* embedded in the site: the parent shows the title and the units switch */
  body.embed h1, body.embed #unitsGrp { display: none; }
  /* layout: collapsible tree column + drawing */
  .layout { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 20px; align-items: start; }
  .layout.notree { grid-template-columns: minmax(0, 1fr); }
  .layout.notree #treeCol { display: none; }
  @media (max-width: 860px) { .layout { grid-template-columns: minmax(0, 1fr); } #treeCol { position: static !important; max-height: 50vh !important; border-right: 0 !important; padding-right: 0 !important; } }
  /* tree column */
  #treeCol { position: sticky; top: 12px; max-height: calc(100vh - 24px); display: flex; flex-direction: column; border-right: 1px solid var(--line); padding-right: 10px; }
  .treeTools { display: flex; align-items: center; gap: 4px; padding: 0 0 6px; }
  .treeTools input { flex: 1; min-width: 0; font: inherit; color: var(--fg); background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .treeTools input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .treeTools button { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 0; border-radius: 4px; padding: 3px 5px; cursor: pointer; line-height: 1; }
  .treeTools button:hover { color: var(--fg); background: var(--card); }
  #tree { overflow: auto; padding: 2px 0 10px; outline: none; flex: 1; }
  #tree:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .node { display: flex; align-items: center; gap: 6px; padding: 2px 6px; border-radius: 6px; cursor: pointer; user-select: none; white-space: nowrap; font-size: 13px; }
  .node:hover, .node.hl { background: var(--card); }
  .node.sel { background: var(--accent-soft); box-shadow: inset 2px 0 0 var(--accent); }
  .node.sel .name { color: var(--accent); font-weight: 600; }
  .node .caret { width: 12px; flex: 0 0 12px; text-align: center; color: var(--muted); font-size: 9px; }
  .node .caret.leaf { visibility: hidden; }
  .node .tag { flex: 0 0 auto; font-size: 10px; font-weight: 600; letter-spacing: .3px; line-height: 1; padding: 2px 3px; border-radius: 4px; border: 1px solid var(--k); color: var(--k); min-width: 24px; text-align: center; opacity: .9; }
  .node .name { overflow: hidden; text-overflow: ellipsis; }
  .node .name mark { background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .node .meta { margin-left: auto; color: var(--muted); font-size: 11.5px; padding-left: 8px; font-variant-numeric: tabular-nums; }
  .kids.closed { display: none; }
  .empty { padding: 10px 6px; color: var(--muted); font-size: 13px; }
  /* drawing */
  .stats { color: var(--muted); font-size: 12.5px; margin: 0 0 2px; }
  .stats b { color: var(--fg); font-weight: 500; }
  #card { position: relative; overflow-x: auto; outline: none; }
  #card:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  #card.dragging, #card.dragging svg * { cursor: grabbing; }
  #card svg { display: block; width: 100%; min-width: 760px; height: auto; max-height: calc(100vh - 150px); font-size: 11px; touch-action: none; }
  .zoomctl { position: absolute; top: 6px; right: 6px; display: flex; flex-direction: column; gap: 3px; opacity: .75; }
  .zoomctl:hover { opacity: 1; }
  .zoomctl button { width: 26px; height: 26px; padding: 0; font: inherit; font-size: 15px; line-height: 1; color: var(--muted); background: var(--bg); border: 1px solid var(--line); border-radius: 5px; cursor: pointer; }
  .zoomctl button:hover { color: var(--fg); }
  .zoomto { font: inherit; font-size: 12px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 5px; padding: 1px 8px; cursor: pointer; }
  .zoomto:hover { color: var(--fg); }
  .key { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 2px 12px; color: var(--muted); font-size: 11.5px; margin: 0; }
  .key span { display: inline-flex; align-items: center; gap: 4px; }
  .key i { display: inline-block; width: 9px; height: 9px; border-radius: 2px; background: var(--k); opacity: .7; }
  .body { fill: var(--k); fill-opacity: .18; stroke: var(--k); stroke-width: 1; stroke-opacity: .85; stroke-linejoin: round; cursor: pointer; vector-effect: non-scaling-stroke; }
  .body.alt { fill-opacity: .30; }
  .silhouette { fill: none; stroke: var(--fg); stroke-width: 1.4; stroke-linejoin: round; pointer-events: none; vector-effect: non-scaling-stroke; }
  .centre { stroke: var(--muted); stroke-width: .8; stroke-dasharray: 14 4 2 4; opacity: .7; pointer-events: none; vector-effect: non-scaling-stroke; }
  .fin { fill: var(--k); fill-opacity: .40; stroke: var(--k); stroke-width: 1.1; stroke-linejoin: round; cursor: pointer; vector-effect: non-scaling-stroke; }
  .fin-hint { fill: var(--k-fin); fill-opacity: .25; stroke: var(--k-fin); stroke-width: .7; stroke-dasharray: 3 2; pointer-events: none; vector-effect: non-scaling-stroke; }
  .struct { fill: var(--k); fill-opacity: .38; stroke: var(--k); stroke-width: .8; cursor: pointer; vector-effect: non-scaling-stroke; }
  .struct * { vector-effect: non-scaling-stroke; }
  .massitem { stroke: var(--k); stroke-width: .8; stroke-dasharray: 3 2; cursor: pointer; vector-effect: non-scaling-stroke; }
  .massitem.k-mass { fill: url(#hatch-mass); } .massitem.k-reco { fill: url(#hatch-reco); }
  #hatch-mass line { stroke: var(--k-mass); stroke-width: .8; opacity: .8; } #hatch-reco line { stroke: var(--k-reco); stroke-width: .8; opacity: .8; }
  .body.hl { fill-opacity: .42; stroke: var(--fg); }
  .fin.hl { fill-opacity: .65; stroke: var(--fg); stroke-width: 1.6; }
  .struct.hl { fill-opacity: .7; stroke: var(--fg); stroke-width: 1.4; }
  .massitem.hl { stroke: var(--fg); stroke-width: 1.4; stroke-dasharray: none; }
  /* selection: accent ring on the chosen part, everything else slightly dimmed */
  #card svg.hasSel .body:not(.sel):not(.hl), #card svg.hasSel .fin:not(.sel):not(.hl), #card svg.hasSel .struct:not(.sel):not(.hl), #card svg.hasSel .massitem:not(.sel):not(.hl), #card svg.hasSel .fin-hint { opacity: .5; }
  .body.sel { fill-opacity: .42; }
  .fin.sel, .struct.sel { fill-opacity: .7; }
  .massitem.sel { stroke-dasharray: none; }
  .selring, .selring * { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-dasharray: none; pointer-events: none; vector-effect: non-scaling-stroke; }
  .dim line, .dim polyline { stroke: var(--muted); stroke-width: .8; fill: none; vector-effect: non-scaling-stroke; }
  .dim .ext { stroke-width: .6; opacity: .8; }
  .dim polygon { fill: var(--muted); stroke: none; }
  .dim text { fill: var(--fg); paint-order: stroke; stroke: var(--bg); stroke-width: .28em; stroke-linejoin: round; }
  .dim text.name { fill: var(--muted); font-size: .9em; }
  .dim text.diam { font-weight: 600; }
  /* tooltip */
  #tip { position: fixed; z-index: 10; pointer-events: none; display: none; max-width: 300px; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,.18); padding: 8px 10px; font-size: 13px; line-height: 1.4; }
  #tip .t { font-weight: 600; }
  #tip .k { color: var(--k, var(--muted)); font-size: 12px; margin-bottom: 4px; }
  #tip dl { display: grid; grid-template-columns: auto 1fr; gap: 1px 10px; margin: 0; }
  #tip dt { color: var(--muted); } #tip dd { margin: 0; font-variant-numeric: tabular-nums; }
  /* details */
  .detail { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); }
  .detail .head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; margin-bottom: 8px; }
  .detail h2 { font-size: 15px; font-weight: 600; margin: 0; word-break: break-word; }
  .detail .kindlabel { font-size: 12.5px; color: var(--k, var(--muted)); }
  .detail .crumbs { font-size: 12.5px; color: var(--muted); display: flex; flex-direction: column; gap: 2px; }
  .detail .crumbs > * { display: block; padding-left: calc(var(--d, 0) * 12px); }
  .detail .mass { margin: 0 0 14px; font-size: 13px; font-variant-numeric: tabular-nums; }
  .detail .mass b { font-weight: 600; }
  .detail .src { color: var(--muted); font-size: 12px; }
  .detail .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .detail .crumbs a:hover { text-decoration: underline; }
  .detail .crumbs .here { color: var(--fg); font-weight: 600; }
  .detail .grid { display: grid; grid-template-columns: minmax(260px, 1.2fr) minmax(220px, 1fr); gap: 12px 36px; align-items: start; }
  .detail .rawcol { display: none; }
  main.adv .detail .grid { grid-template-columns: minmax(260px, 1.2fr) minmax(220px, 1fr) minmax(0, 2fr); }
  main.adv .detail .rawcol { display: block; }
  @media (max-width: 900px) { .detail .grid, main.adv .detail .grid { grid-template-columns: minmax(0, 1fr); } }
  .detail h3 { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 0 0 6px; }
  .detail h3 small { text-transform: none; letter-spacing: 0; font-weight: 400; }
  .detail dl { display: grid; grid-template-columns: auto 1fr; gap: 2px 14px; margin: 0; font-size: 13px; }
  .detail dt { color: var(--muted); white-space: nowrap; } .detail dd { margin: 0; font-variant-numeric: tabular-nums; }
  .detail table.raw { border-collapse: collapse; width: 100%; margin: 0; font-size: 12px; }
  .detail table.raw td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: normal; word-break: break-word; vertical-align: top; }
  .detail table.raw td.k { color: var(--muted); width: 38%; }
  .detail .placeholder { color: var(--muted); font-size: 13px; margin: 0; }
</style>
</head>
<body>
<main id="main">
  <div class="bar">
    <h1>Vehicle side view</h1>
    <span class="grp"><label for="design">Design</label><select id="design"></select></span>
    <span class="grp" id="unitsGrp"><label>Units</label>
      <span class="seg" id="units"><button data-u="in" class="on">in</button><button data-u="mm">mm</button></span>
    </span>
    <label class="chk"><input type="checkbox" id="adv"> Advanced info</label>
    <span class="built" id="built">__BUILT__</span>
    <button class="btn" id="treeToggle" type="button" aria-pressed="true" title="Show or hide the component tree">Hide tree</button>
  </div>

  <div class="layout" id="layout">
    <aside id="treeCol" aria-label="Component tree">
      <div class="treeTools">
        <input id="search" type="search" placeholder="Filter components…" autocomplete="off" spellcheck="false" aria-label="Filter components">
        <button type="button" id="expandAll" title="Expand all">⊞</button><button type="button" id="collapseAll" title="Collapse all">⊟</button>
      </div>
      <div id="tree" tabindex="0" role="tree" title="↑ ↓ move through the tree, ← → fold"></div>
    </aside>

    <div id="mainCol">
      <p class="stats" id="stats"></p>
      <div id="card" tabindex="0">
        <div id="drawing"></div>
        <div class="zoomctl" title="Wheel: zoom · drag: pan · double-click: fit"><button type="button" data-z="in" title="Zoom in (+)">+</button><button type="button" data-z="out" title="Zoom out (−)">−</button><button type="button" data-z="fit" title="Fit the whole rocket (0)">⤢</button></div>
      </div>
      <p class="key" id="key"></p>
      <section class="detail" id="detail" aria-live="polite"></section>
    </div>
  </div>
</main>
<div id="tip"></div>

<script type="application/json" id="geo">__GEOMETRY__</script>

<script>
(function () {
'use strict';
var DATA = JSON.parse(document.getElementById('geo').textContent);
var NAMES = Object.keys(DATA);
NAMES.forEach(function (n) { DATA[n].title = n; });
var UNITS = { 'in': { f: 1 / 0.0254, d: 2, s: 'in' }, 'mm': { f: 1000, d: 0, s: 'mm' } };
var state = { design: NAMES[0], units: 'in', selected: null, query: '', tree: true, adv: false, embed: false, collapsed: {} };

var BODY = { nosecone: 1, bodytube: 1, transition: 1 };
var MASSY = { masscomponent: 1, parachute: 1, streamer: 1, shockcord: 1 };
/* kind -> [colour group, 2-letter tag]; the group picks --k (see .k-* in the CSS) in drawing, tree and details */
var KIND = {
  nosecone: ['nose', 'NC'], bodytube: ['tube', 'BT'], transition: ['transition', 'TR'],
  trapezoidfinset: ['fin', 'FN'], ellipticalfinset: ['fin', 'FN'], freeformfinset: ['fin', 'FN'], tubefinset: ['fin', 'TF'],
  masscomponent: ['mass', 'MC'], parachute: ['reco', 'PC'], streamer: ['reco', 'SR'], shockcord: ['reco', 'SC'],
  innertube: ['struct', 'IT'], tubecoupler: ['struct', 'TC'], centeringring: ['struct', 'CR'], bulkhead: ['struct', 'BH'], engineblock: ['struct', 'EB'],
  launchlug: ['struct', 'LL'], railbutton: ['struct', 'RB'],
  stage: ['stage', 'ST'], boosterset: ['stage', 'BS'], podset: ['stage', 'PS'], parallelstage: ['stage', 'BS']
};
var GROUP_LABEL = { nose: 'nose cone', tube: 'body tube', transition: 'transition', fin: 'fins', struct: 'structure', mass: 'mass', reco: 'recovery' };
var GROUP_ORDER = ['nose', 'tube', 'transition', 'fin', 'struct', 'mass', 'reco'];
function kindOf(c) { return KIND[c.kind] || ['mass', '??']; }
function kcls(c) { return 'k-' + kindOf(c)[0]; }

function num(v) { return (typeof v === 'number' && isFinite(v)) ? v : null; }
function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
function fmtLen(m) { var u = UNITS[state.units]; return (m * u.f).toFixed(u.d) + ' ' + u.s; }
function fmtLenOpt(m) { return num(m) !== null ? fmtLen(m) : '—'; }
function fmtMass(kg) { return state.units === 'in' ? (kg * 2.20462).toFixed(2) + ' lb' : kg.toFixed(2) + ' kg'; }
function fmtMassShort(kg) { return state.units === 'in' ? (kg * 2.20462).toFixed(2) + ' lb' : (kg < 1 ? (kg * 1000).toFixed(0) + ' g' : kg.toFixed(2) + ' kg'); }
/* Where OpenRocket's mass for a part comes from (override / own mass / material density) as a short note. */
function massNote(c) {
  var f = c.fields || {}, src = c.mass_source;
  if (src === 'material') {
    var dens = num(parseFloat(f.material_density)), unit = { bulk: 'kg/m3', surface: 'kg/m2', line: 'kg/m' }[f.material_type] || '';
    var inner = [f.material, dens !== null ? (dens >= 10 ? dens.toFixed(0) : +dens.toPrecision(3)) + (unit ? ' ' + unit : '') : null].filter(Boolean).join(', ');
    return 'from material' + (inner ? ' (' + inner + ')' : '');
  }
  if (src === 'override') return 'override in OpenRocket' + (num(c.mass_computed) !== null ? ' (computed ' + fmtMass(c.mass_computed) + ')' : '');
  if (src === 'component') return 'mass component';
  return num(c.mass) !== null ? '' : 'not set';
}
function r2(v) { return Math.round(v * 100) / 100; }

/* Resolve a usable radius for internal parts; "auto" radii inherit the parent's inside radius. */
function partRadius(c, byId) {
  var r = num(c.radius);
  if (r !== null && r > 0) return r;
  var p = byId[c.parent];
  for (var guard = 0; p && guard < 10; guard++) {
    var pr = num(p.r_aft); if (pr === null) pr = num(p.radius);
    if (pr !== null && pr > 0) return Math.max(pr - (num(p.thickness) || 0), 0.001);
    p = byId[p.parent];
  }
  return null;
}

/* ---------- SVG drawing primitives (string based) ---------- */
function arrow(x, y, ang) {   // arrowhead pointing in direction ang (radians), tip at (x, y)
  var L = 7, W = 2.6, c = Math.cos(ang), s = Math.sin(ang);
  var bx = x - L * c, by = y - L * s;
  return '<polygon data-tip="' + r2(x) + ',' + r2(y) + '" points="' + r2(x) + ',' + r2(y) + ' ' + r2(bx - W * s) + ',' + r2(by + W * c) + ' ' + r2(bx + W * s) + ',' + r2(by - W * c) + '"/>';
}
function line(x1, y1, x2, y2, cls) {
  return '<line' + (cls ? ' class="' + cls + '"' : '') + ' x1="' + r2(x1) + '" y1="' + r2(y1) + '" x2="' + r2(x2) + '" y2="' + r2(y2) + '"/>';
}
function text(x, y, s, cls, anchor) {
  return '<text x="' + r2(x) + '" y="' + r2(y) + '" text-anchor="' + (anchor || 'middle') + '"' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(s) + '</text>';
}
/* Horizontal dimension between X1..X2 at height Y; ext = [[x, yFrom], ...] extension lines; labels: [value, name?]; row2: push label a row lower; title: hover note */
function dimH(X1, X2, Y, value, name, ext, below, alloc, title) {
  var out = '<g class="dim">' + (title ? '<title>' + esc(title) + '</title>' : '');
  for (var i = 0; i < ext.length; i++) out += line(ext[i][0], ext[i][1], ext[i][0], Y + (below ? 4 : -4), 'ext');
  var w = X2 - X1, inside = w >= 26;
  if (inside) out += line(X1, Y, X2, Y) + arrow(X1, Y, Math.PI) + arrow(X2, Y, 0);
  else out += line(X1 - 16, Y, X2 + 16, Y) + arrow(X1, Y, 0) + arrow(X2, Y, Math.PI);
  var mid = (X1 + X2) / 2, ty = below ? Y + 12 : Y - 4;
  var valueW = value.length * 6.2, nameW = name ? name.length * 5.6 : 0;
  if (alloc) {                    // chained dimensions: allocate label rows so neighbours never collide
    var fits = valueW <= w - 6;
    var row = alloc.take(fits ? 0 : 1, mid - valueW / 2, mid + valueW / 2);
    var ry = alloc.rows[row];
    if (row > 0) out += line(mid, Y, mid, ry - 10, 'ext');
    out += text(mid, ry, value);
    if (name && nameW <= w - 6) {
      var nrow = alloc.take(row + 1, mid - nameW / 2, mid + nameW / 2, true);
      if (nrow >= 0) out += text(mid, alloc.rows[nrow], name, 'name');
    }
  } else if (valueW > w - 6) {    // too narrow: hang the value off a short leader one row further out
    var ty2 = below ? Y + 26 : Y - 18;
    out += line(mid, Y, mid, below ? ty2 - 10 : ty2 + 3, 'ext') + text(mid, ty2, value);
  } else {
    out += text(mid, ty, value);
    if (name && nameW <= w - 6) out += text(mid, below ? ty + 12 : ty - 12, name, 'name');
  }
  return out + '</g>';
}
/* Row allocator for a chain of dimensions: rows = baseline y of each label row; take() returns the first free row at or after `from`. */
function rowAlloc(rows) {
  var occ = rows.map(function () { return -Infinity; });
  return { rows: rows, take: function (from, x0, x1, optional) {
    for (var i = from; i < rows.length; i++) if (occ[i] <= x0 - 8) { occ[i] = x1; return i; }
    if (optional) return -1;
    var last = rows.length - 1; occ[last] = Math.max(occ[last], x1); return last;
  } };
}
/* Vertical dimension between Y1..Y2 at X; label drawn to the right. */
function dimV(X, Y1, Y2, value, ext, cls) {
  var out = '<g class="dim">';

/* ---------- URL hash: design / units / sel / tree / adv are ours; embed, stab and (when embedded) units belong to the parent page ---------- */

  if (!state.embed) { if (state.units !== 'in') p.set('units', state.units); else p.delete('units'); }
  if (state.selected) p.set('sel', state.selected); else p.delete('sel');

  function parseVB(svg) { var v = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number); return v.length === 4 ? { x: v[0], y: v[1], w: v[2], h: v[3] } : null; }
  function vbStr(v) { return r2(v.x) + ' ' + r2(v.y) + ' ' + r2(v.w) + ' ' + r2(v.h); }

  }
  function setView(v) {

    svg.setAttribute('viewBox', vbStr(v));
    zoomed = Math.abs(v.w - fitView.w) > 1e-6 || Math.abs(v.x - fitView.x) > 1e-6 || Math.abs(v.y - fitView.y) > 1e-6;

  }
  function fitAll() { if (fitView) setView({ x: fitView.x, y: fitView.y, w: fitView.w, h: fitView.h }); }
  function clampW(w) { return Math.min(Math.max(w, fitView.w / ZOOM_MAX), fitView.w / ZOOM_MIN); }
  /* zoom by factor f (> 1 zooms in) keeping the client point (px, py) fixed; without a point, about the centre */
  function zoomAt(f, px, py) {

  function zoomToPart(id) {
    var bx = current && current.boxes[id]; if (!bx || !fitView) return;
    var aspect = fitView.w / fitView.h;
    var w = (bx[2] - bx[0]) * 1.5 + 24, h = (bx[3] - bx[1]) * 1.5 + 24;
    if (w / h < aspect) w = h * aspect;
    w = clampW(w); h = w / aspect;

  }, { passive: false });
  var drag = null, suppressClick = false;
  card.addEventListener('mousedown', function (e) {
    if (e.button !== 0 || !inSvg(e)) return;
    e.preventDefault(); card.focus();

  });
  window.addEventListener('mousemove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) < 4) return;
    drag.moved = true; drag.x = e.clientX; drag.y = e.clientY;
    card.classList.add('dragging'); hideTip();

  });
  window.addEventListener('mouseup', function () {
    if (drag && drag.moved) suppressClick = true;
    drag = null; card.classList.remove('dragging');
  });
  card.addEventListener('dblclick', function (e) {
    if (inSvg(e) && !(e.target.closest && e.target.closest('[data-id]'))) fitAll();
  });
  card.addEventListener('keydown', function (e) {
    if (e.key === '+' || e.key === '=') { zoomAt(STEP); e.preventDefault(); }
    else if (e.key === '-' || e.key === '_') { zoomAt(1 / STEP); e.preventDefault(); }
    else if (e.key === '0') { fitAll(); e.preventDefault(); }
  });
  Array.prototype.forEach.call(card.querySelectorAll('.zoomctl button'), function (b) {
    b.addEventListener('click', function () {
      var z = b.getAttribute('data-z');
      if (z === 'in') zoomAt(STEP); else if (z === 'out') zoomAt(1 / STEP); else fitAll();
    });
  });
  // touch: one finger pans, two fingers pinch about their midpoint
  var touch = null;
  function tDist(t) { var dx = t[0].clientX - t[1].clientX, dy = t[0].clientY - t[1].clientY; return Math.sqrt(dx * dx + dy * dy); }
  card.addEventListener('touchstart', function (e) {
    if (!inSvg(e)) { touch = null; return; }
    var t = e.touches;
    touch = t.length === 1 ? { x: t[0].clientX, y: t[0].clientY } : t.length === 2 ? { d: tDist(t) } : null;
  }, { passive: true });
  card.addEventListener('touchmove', function (e) {
    if (!touch) return;
    var t = e.touches;
    if (t.length === 1 && touch.x !== undefined) { panBy(t[0].clientX - touch.x, t[0].clientY - touch.y); touch.x = t[0].clientX; touch.y = t[0].clientY; }
    else if (t.length === 2) { var dnow = tDist(t); if (touch.d === undefined) touch = { d: dnow }; else if (touch.d > 0) { zoomAt(dnow / touch.d, (t[0].clientX + t[1].clientX) / 2, (t[0].clientY + t[1].clientY) / 2); touch.d = dnow; } }
    e.preventDefault();
  }, { passive: false });
  card.addEventListener('touchend', function (e) { touch = e.touches.length ? (e.touches.length === 1 ? { x: e.touches[0].clientX, y: e.touches[0].clientY } : { d: tDist(e.touches) }) : null; }, { passive: true });

  /* ---------- tree ---------- */
  function renderTree() {
    var q = state.query.trim().toLowerCase();
    var vis = {}, shown = 0;
    function matches(n) { var c = n.c; return !q || (c.name + ' ' + (c.label || '') + ' ' + c.kind).toLowerCase().indexOf(q) >= 0; }
    (function calc(n) { var v = matches(n); n.children.forEach(function (k) { if (calc(k)) v = true; }); vis[n.c.id] = v; return v; })({ c: { id: '__root', name: '', label: '', kind: '' }, children: model.roots });
    var h = '';
    function emit(n) {
      if (!vis[n.c.id]) return;
      shown++;
      var c = n.c, kt = kindOf(c), hasKids = n.children.length > 0;
      var closed = hasKids && !q && !!state.collapsed[c.id];
      var nm = esc(c.name);
      if (q) { var i = c.name.toLowerCase().indexOf(q); if (i >= 0) nm = esc(c.name.slice(0, i)) + '<mark>' + esc(c.name.slice(i, i + q.length)) + '</mark>' + esc(c.name.slice(i + q.length)); }
      var meta = [];
      if (num(c.length) !== null && c.kind !== 'stage') meta.push(fmtLen(c.length));
      if (num(c.mass) !== null) meta.push(fmtMassShort(c.mass));
      h += '<div class="node' + (c.id === state.selected ? ' sel' : '') + '" role="treeitem" data-id="' + esc(c.id) + '" style="padding-left:' + (6 + c.depth * 14) + 'px" title="' + esc(c.name) + ' — ' + esc(c.label || c.kind) + '"' + (hasKids ? ' aria-expanded="' + (!closed) + '"' : '') + '>' +
        '<span class="caret' + (hasKids ? '' : ' leaf') + '">' + (closed ? '▶' : '▼') + '</span>' +
        '<span class="tag k-' + kt[0] + '">' + kt[1] + '</span>' +
        '<span class="name">' + nm + '</span><span class="meta">' + esc(meta.join(' · ')) + '</span></div>';
      if (hasKids) { h += '<div class="kids' + (closed ? ' closed' : '') + '" role="group">'; n.children.forEach(emit); h += '</div>'; }
    }
    model.roots.forEach(emit);
    treeEl.innerHTML = shown ? h : '<div class="empty">No components match "' + esc(state.query) + '".</div>';
  }
  function toggleNode(id, force) {
    if (force === true) delete state.collapsed[id];
    else if (force === false) state.collapsed[id] = 1;
    else if (state.collapsed[id]) delete state.collapsed[id]; else state.collapsed[id] = 1;
    renderTree();
  }
  function visibleRows() {
    return Array.prototype.filter.call(treeEl.querySelectorAll('.node'), function (r) { return !r.closest('.kids.closed'); });
  }
  treeEl.addEventListener('click', function (e) {
    var row = e.target.closest ? e.target.closest('.node') : null; if (!row) return;
    if (e.target.classList.contains('caret') && !e.target.classList.contains('leaf')) { toggleNode(row.getAttribute('data-id')); return; }
    select(row.getAttribute('data-id'), false);
  });
  treeEl.addEventListener('dblclick', function (e) {
    var row = e.target.closest ? e.target.closest('.node') : null; if (row) toggleNode(row.getAttribute('data-id'));
  });
  treeEl.addEventListener('mouseover', function (e) { var row = e.target.closest ? e.target.closest('.node') : null; if (row) setHL(row.getAttribute('data-id')); });
  treeEl.addEventListener('mouseleave', function () { setHL(null); });
  searchEl.addEventListener('input', function () { state.query = searchEl.value; renderTree(); });
  document.getElementById('expandAll').addEventListener('click', function () { state.collapsed = {}; renderTree(); });
  document.getElementById('collapseAll').addEventListener('click', function () {
    model.order.forEach(function (n) { if (n.children.length && n.c.kind !== 'stage') state.collapsed[n.c.id] = 1; });
    renderTree();
  });
  document.addEventListener('keydown', function (e) {
    var t = e.target;
    if (t && t.matches && t.matches('input, select, textarea')) {
      if (t === searchEl && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) treeEl.focus(); else return;
    }
    if (['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].indexOf(e.key) < 0) return;
    var rows = visibleRows(); if (!rows.length) return;
    var i = -1;
    for (var k = 0; k < rows.length; k++) if (rows[k].getAttribute('data-id') === state.selected) { i = k; break; }
    if (e.key === 'ArrowDown') i = Math.min(rows.length - 1, i + 1);
    else if (e.key === 'ArrowUp') i = Math.max(0, i - 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = rows.length - 1;

      if (i < 0) return;

      else { if (n.children.length && !state.collapsed[id]) toggleNode(id, false); else if (n.parent) select(n.parent.c.id, true); }
      e.preventDefault();
      return;
    }
    e.preventDefault();
    if (i >= 0) select(rows[i].getAttribute('data-id'), true);
  });

  /* ---------- selection (tree, drawing, details) ---------- */
  function select(id, reveal) {
    if (id !== null && !model.nodes[id]) return;
    state.selected = id;
    if (id !== null && reveal !== false) {
      var changed = false;
      for (var p = model.nodes[id].parent; p; p = p.parent) if (state.collapsed[p.c.id]) { delete state.collapsed[p.c.id]; changed = true; }

  }
  function applySelection(reveal) {
    var id = state.selected;

  /* ---------- hash round-trip ---------- */

    var u = unitsFromHash(h.get('units'));

    state.tree = h.get('tree') !== '0';
    state.adv = h.get('adv') === '1';

    if (want !== state.selected) select(want, true);
  }
  window.addEventListener('hashchange', applyHash);
  applyHash();
  window.vehicleSideview = { state: state, select: select, setDesign: setDesign, setUnits: setUnits, renderTree: renderTree, applyHash: applyHash, names: NAMES };
}

if (typeof window !== 'undefined' && typeof document !== 'undefined' && document.getElementById('card')) init();
if (typeof module !== 'undefined') module.exports = { render: render, describe: describe, DATA: DATA, state: state };
})();
