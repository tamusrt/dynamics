<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle Explorer</title>
<style>
  :root {
    color-scheme: light dark;
    --bg:#fff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --accent:#0969da; --hover:#eaeef2;
    --k-body:#6e7781; --k-fin:#bf8700; --k-mass:#8250df; --k-reco:#1a7f37; --k-struct:#1b7c83; --k-ext:#cf222e; --k-stage:#1f2328;
    --accent-soft: rgba(9,105,218,.14);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --accent:#58a6ff; --hover:#21262d;
      --k-body:#8b949e; --k-fin:#e3b341; --k-mass:#a371f7; --k-reco:#3fb950; --k-struct:#39c5cf; --k-ext:#ff7b72; --k-stage:#e6edf3;
      --accent-soft: rgba(88,166,255,.18);
    }
  }
  :root[data-theme="dark"] {
    --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --accent:#58a6ff; --hover:#21262d;
    --k-body:#8b949e; --k-fin:#e3b341; --k-mass:#a371f7; --k-reco:#3fb950; --k-struct:#39c5cf; --k-ext:#ff7b72; --k-stage:#e6edf3;
    --accent-soft: rgba(88,166,255,.18);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif, "Apple Color Emoji", "Segoe UI Emoji";
    display: flex; flex-direction: column;
  }
  button, select, input { font: inherit; color: inherit; }
  button { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 10px; cursor: pointer; }
  button:hover { background: var(--hover); }
  select { background: var(--card); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
  .muted { color: var(--muted); }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px; }

  header {
    display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
    padding: 10px 16px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header h1 { font-size: 15px; font-weight: 600; margin: 0 8px 0 0; }
  header .grp { display: flex; align-items: center; gap: 6px; }
  header label { color: var(--muted); font-size: 13px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 4px 10px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
  .spacer { flex: 1; }
  header .hint { font-size: 12.5px; color: var(--muted); }

  main {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 300px minmax(260px, 1fr) 340px;
  }
  main > * { min-height: 0; overflow: auto; }
  .pane { border-right: 1px solid var(--line); }
  .pane:last-child { border-right: 0; }
  @media (max-width: 980px) {
    body { height: auto; }
    main { grid-template-columns: 1fr; }
    main > * { overflow: visible; }
    .pane { border-right: 0; border-bottom: 1px solid var(--line); }
    #drawPane { height: 60vh; }
  }

  /* ---------- tree ---------- */
  #treePane { display: flex; flex-direction: column; }
  .treeTools { padding: 10px 12px 8px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--bg); z-index: 1; }
  .treeTools input {
    width: 100%; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: var(--bg);
  }
  .treeTools input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  #tree { padding: 6px 6px 16px; flex: 1; outline: none; }
  #tree:focus-visible { box-shadow: inset 0 0 0 2px var(--accent-soft); }
  .node { display: flex; align-items: center; gap: 6px; padding: 3px 6px; border-radius: 6px; cursor: pointer; user-select: none; white-space: nowrap; }
  .node:hover, .node.hover { background: var(--hover); }
  .node.selected { background: var(--accent-soft); }
  .node.selected .name { color: var(--accent); font-weight: 600; }
  .node.dim { opacity: .45; }
  .node .caret { width: 14px; flex: 0 0 14px; text-align: center; color: var(--muted); font-size: 10px; }
  .node .caret.leaf { visibility: hidden; }
  .node .tag {
    flex: 0 0 auto; font-size: 10px; font-weight: 700; letter-spacing: .3px; line-height: 1;
    padding: 3px 4px; border-radius: 4px; color: #fff; background: var(--k); min-width: 22px; text-align: center;
  }
  .node .name { overflow: hidden; text-overflow: ellipsis; }
  .node .meta { margin-left: auto; color: var(--muted); font-size: 12px; padding-left: 8px; }
  .node .name mark { background: transparent; color: var(--accent); text-decoration: underline; text-underline-offset: 2px; }
  .kids.closed { display: none; }
  .empty { padding: 16px 12px; color: var(--muted); }

  /* ---------- drawing ---------- */
  #drawPane { display: flex; flex-direction: column; background: var(--bg); }
  .drawHead { padding: 8px 14px; border-bottom: 1px solid var(--line); display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
  .drawHead b { color: var(--fg); font-weight: 600; }
  .drawBody { flex: 1; min-height: 0; position: relative; padding: 10px; }
  svg { width: 100%; height: 100%; display: block; }
  .legend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 6px 14px 8px; border-top: 1px solid var(--line); font-size: 12px; color: var(--muted); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--k); margin-right: 5px; vertical-align: -1px; }
  .legend .note { margin-left: auto; font-style: italic; }

  /* svg parts: colours from --k of the kind group */
  .part { cursor: pointer; vector-effect: non-scaling-stroke; }
  .part * { vector-effect: non-scaling-stroke; }
  .body  { fill: var(--k); fill-opacity: .12; stroke: var(--k); stroke-width: 1.2; }
  .fin   { fill: var(--k); fill-opacity: .35; stroke: var(--k); stroke-width: 1.1; }
  .inner { fill: var(--k); fill-opacity: .22; stroke: var(--k); stroke-width: .8; stroke-opacity: .7; }
  .inner.hollow { fill-opacity: .08; stroke-dasharray: 3 2; }
  .axis { stroke: var(--muted); stroke-width: .6; stroke-dasharray: 4 4; opacity: .6; vector-effect: non-scaling-stroke; }
  svg.hasSel .part:not(.selected):not(.hover) { opacity: .35; }
  .part.hover { stroke: var(--accent); stroke-width: 1.8; fill-opacity: .4; }
  .part.selected { fill: var(--accent) !important; fill-opacity: .55; stroke: var(--accent); stroke-width: 2; stroke-dasharray: none; }

  /* ---------- details ---------- */
  #detailPane { padding: 14px 16px 24px; }
  #detailPane h2 { font-size: 16px; margin: 0 0 2px; word-break: break-word; }
  #detailPane .kindline { margin-bottom: 12px; }
  #detailPane h3 { font-size: 12px; text-transform: uppercase; letter-spacing: .6px; color: var(--muted); margin: 16px 0 6px; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  td { padding: 4px 6px; border-top: 1px solid var(--line); vertical-align: top; }
  tr:first-child td { border-top: 0; }
  td.k { color: var(--muted); width: 42%; }
  td.v { word-break: break-word; }
  .resolved td { border-top-color: transparent; padding: 2px 6px; }
  .resolved td.v { font-variant-numeric: tabular-nums; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 6px 4px; }
  .crumbs { display: flex; flex-wrap: wrap; align-items: center; gap: 3px; font-size: 13px; }
  .crumbs a { color: var(--accent); cursor: pointer; text-decoration: none; }
  .crumbs a:hover { text-decoration: underline; }
  .crumbs .sep { color: var(--muted); }
  .crumbs .here { font-weight: 600; }
  .placeholder { color: var(--muted); padding-top: 40px; text-align: center; }
  kbd { font-family: inherit; font-size: 11px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--card); }
</style>
</head>
<body>
<header>
  <h1>Vehicle explorer</h1>
  <div class="grp">
    <label for="designSel">Design</label>
    <select id="designSel"></select>
  </div>
  <div class="grp">
    <label>Units</label>
    <div class="seg" id="unitSeg">
      <button type="button" data-u="in" aria-pressed="true">in</button>
      <button type="button" data-u="mm" aria-pressed="false">mm</button>
    </div>
  </div>
  <div class="grp">
    <label>View</label>
    <div class="seg" id="orientSeg">
      <button type="button" data-o="h" aria-pressed="true">Horizontal</button>
      <button type="button" data-o="v" aria-pressed="false">Vertical</button>
    </div>
  </div>
  <div class="grp">
    <button type="button" id="expandAll">Expand all</button>
    <button type="button" id="collapseAll">Collapse all</button>
  </div>
  <span class="spacer"></span>
  <span class="hint">Click a part in the tree or the drawing. <kbd>↑</kbd> <kbd>↓</kbd> move, <kbd>←</kbd> <kbd>→</kbd> fold.</span>
</header>

<main>
  <section class="pane" id="treePane">
    <div class="treeTools">
      <input id="search" type="search" placeholder="Filter components…" autocomplete="off" spellcheck="false">
    </div>
    <div id="tree" tabindex="0" role="tree" aria-label="Component tree"></div>
  </section>

  <section class="pane" id="drawPane">
    <div class="drawHead" id="drawHead"></div>
    <div class="drawBody"><svg id="svg" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div class="legend" id="legend"></div>
  </section>

  <section class="pane" id="detailPane">
    <div class="placeholder">Select a component to see its details.</div>
  </section>
</main>

<script>
(function () {
  'use strict';

  // ---------- data ----------
  const DATA = JSON.parse(document.getElementById('geometry').textContent);
  const KEYS = Object.keys(DATA);

  // kind -> [group, 2-letter tag]
  const KIND = {
    nosecone: ['body', 'NC'], bodytube: ['body', 'BT'], transition: ['body', 'TR'],
    trapezoidfinset: ['fin', 'FN'], ellipticalfinset: ['fin', 'FN'], freeformfinset: ['fin', 'FN'], tubefinset: ['fin', 'TF'],
    masscomponent: ['mass', 'MC'],
    parachute: ['reco', 'PC'], streamer: ['reco', 'SR'], shockcord: ['reco', 'SC'],
    innertube: ['struct', 'IT'], tubecoupler: ['struct', 'TC'], centeringring: ['struct', 'CR'], bulkhead: ['struct', 'BH'], engineblock: ['struct', 'EB'],
    launchlug: ['ext', 'LL'], railbutton: ['ext', 'RB'],
    stage: ['stage', 'ST'], boosterset: ['stage', 'BS'], podset: ['stage', 'PS'], parallelstage: ['stage', 'BS']
  };
  const GROUP_LABEL = { body: 'Body (nose, tubes, transitions)', fin: 'Fins', mass: 'Mass components', reco: 'Recovery', struct: 'Internal structure', ext: 'External hardware', stage: 'Stage' };
  const kindOf = c => KIND[c.kind] || ['mass', '??'];
  const num = v => typeof v === 'number' && isFinite(v);

  // ---------- state ----------
  const state = { key: KEYS[0], units: 'in', orient: 'h', selected: null, query: '', collapsed: new Set(), model: null };

  function buildModel(design) {
    const byId = new Map();
    design.components.forEach(c => byId.set(c.id, { c, children: [], parent: null }));
    const roots = [];
    design.components.forEach(c => {
      const n = byId.get(c.id);
      const p = c.parent ? byId.get(c.parent) : null;
      if (p) { n.parent = p; p.children.push(n); } else roots.push(n);
    });
    const order = [];
    (function walk(list) { list.forEach(n => { order.push(n); walk(n.children); }); })(roots);
    return { design, byId, roots, order };
  }

  // ---------- units ----------
  function fmtLen(m, digits) {
    if (!num(m)) return '—';
    if (state.units === 'in') return (m / 0.0254).toFixed(digits == null ? 2 : digits) + ' in';
    return (m * 1000).toFixed(digits == null ? 1 : digits) + ' mm';
  }
  function fmtMassShort(kg) {
    if (!num(kg)) return '';
    if (state.units === 'in') return (kg * 2.20462).toFixed(2) + ' lb';
    return kg < 1 ? (kg * 1000).toFixed(0) + ' g' : kg.toFixed(2) + ' kg';
  }
  function fmtMassLong(kg) {
    if (!num(kg)) return '— (not set in OpenRocket)';
    if (state.units === 'in') return (kg * 2.20462).toFixed(3) + ' lb  (' + kg.toFixed(3) + ' kg)';
    return kg.toFixed(3) + ' kg';
  }
  const esc = s => String(s).replace(/[&<>"]/g, ch => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));

  // effective radius of an internal part (handles "auto")
  function partRadius(n) {
    const c = n.c;
    if (num(c.radius)) return c.radius;
    const p = n.parent && n.parent.c;
    if (p && num(p.r_aft)) return p.r_aft * 0.95;
    if (p && num(p.radius)) return p.radius * 0.95;
    return state.model.design.max_radius * 0.5;
  }

  // ---------- tree ----------
  const treeEl = document.getElementById('tree');

  function matches(n, q) {
    if (!q) return true;
    const c = n.c;
    return (c.name + ' ' + c.label + ' ' + c.kind).toLowerCase().includes(q);
  }
  function renderTree() {
    const q = state.query.trim().toLowerCase();
    const m = state.model;
    // visible = self matches or any descendant matches
    const vis = new Map();
    (function calc(n) {
      let v = matches(n, q);
      n.children.forEach(k => { if (calc(k)) v = true; });
      vis.set(n.c.id, v);
      return v;
    })({ c: { id: '__root', name: '', label: '', kind: '' }, children: m.roots });
    treeEl.innerHTML = '';
    let any = false;
    const emit = (n, container) => {
      if (!vis.get(n.c.id)) return;
      any = true;
      const c = n.c, [grp, tag] = kindOf(c);
      const row = document.createElement('div');
      row.className = 'node';
      row.dataset.id = c.id;
      row.setAttribute('role', 'treeitem');
      row.style.paddingLeft = (6 + c.depth * 16) + 'px';
      const hasKids = n.children.length > 0;
      const closed = hasKids && !q && state.collapsed.has(c.id);
      let nm = esc(c.name);
      if (q) {
        const i = c.name.toLowerCase().indexOf(q);
        if (i >= 0) nm = esc(c.name.slice(0, i)) + '<mark>' + esc(c.name.slice(i, i + q.length)) + '</mark>' + esc(c.name.slice(i + q.length));
      }
      const meta = [];
      if (num(c.length) && c.kind !== 'stage') meta.push(fmtLen(c.length, state.units === 'in' ? 1 : 0));
      if (num(c.mass)) meta.push(fmtMassShort(c.mass));
      row.innerHTML =
        '<span class="caret ' + (hasKids ? '' : 'leaf') + '">' + (closed ? '▶' : '▼') + '</span>' +
        '<span class="tag" style="--k:var(--k-' + grp + ')" title="' + esc(c.label) + '">' + tag + '</span>' +
        '<span class="name" title="' + esc(c.name) + ' — ' + esc(c.label) + '">' + nm + '</span>' +
        '<span class="meta">' + meta.join(' · ') + '</span>';
      if (c.id === state.selected) row.classList.add('selected');
      container.appendChild(row);
      if (hasKids) {
        const kids = document.createElement('div');
        kids.className = 'kids' + (closed ? ' closed' : '');
        kids.dataset.for = c.id;
        n.children.forEach(k => emit(k, kids));
        container.appendChild(kids);
      }
    };
    m.roots.forEach(n => emit(n, treeEl));
    if (!any) treeEl.innerHTML = '<div class="empty">No components match "' + esc(state.query) + '".</div>';
  }

  function toggleNode(id, force) {
    if (force === true) state.collapsed.delete(id);
    else if (force === false) state.collapsed.add(id);
    else if (state.collapsed.has(id)) state.collapsed.delete(id); else state.collapsed.add(id);
    renderTree();
  }

  function visibleRows() {
    return Array.from(treeEl.querySelectorAll('.node')).filter(r => !r.closest('.kids.closed'));
  }

  treeEl.addEventListener('click', e => {
    const row = e.target.closest('.node'); if (!row) return;
    if (e.target.classList.contains('caret') && !e.target.classList.contains('leaf')) { toggleNode(row.dataset.id); return; }
    select(row.dataset.id, false);
  });
  treeEl.addEventListener('dblclick', e => {
    const row = e.target.closest('.node'); if (!row) return;
    toggleNode(row.dataset.id);
  });
  treeEl.addEventListener('mouseover', e => { const row = e.target.closest('.node'); if (row) setHover(row.dataset.id); });
  treeEl.addEventListener('mouseleave', () => setHover(null));

  // keyboard
  document.addEventListener('keydown', e => {
    if (e.target && e.target.matches && e.target.matches('input, select, textarea')) {
      if (e.target.id === 'search' && (e.key === 'ArrowDown' || e.key === 'ArrowUp')) { treeEl.focus(); } else return;
    }
    if (!['ArrowDown', 'ArrowUp', 'ArrowLeft', 'ArrowRight', 'Home', 'End'].includes(e.key)) return;
    const rows = visibleRows(); if (!rows.length) return;
    let i = rows.findIndex(r => r.dataset.id === state.selected);
    if (e.key === 'ArrowDown') i = Math.min(rows.length - 1, i + 1);
    else if (e.key === 'ArrowUp') i = Math.max(0, i - 1);
    else if (e.key === 'Home') i = 0;
    else if (e.key === 'End') i = rows.length - 1;
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      if (i < 0) return;
      const id = rows[i].dataset.id, n = state.model.byId.get(id);
      if (e.key === 'ArrowRight') { if (n.children.length && state.collapsed.has(id)) toggleNode(id, true); }
      else { if (n.children.length && !state.collapsed.has(id)) toggleNode(id, false); else if (n.parent) select(n.parent.c.id, true); }
      e.preventDefault();
      return;
    }
    e.preventDefault();
    if (i >= 0) select(rows[i].dataset.id, true);
  });

  // ---------- drawing ----------
  const svg = document.getElementById('svg');
  const NS = 'http://www.w3.org/2000/svg';
  function el(tag, attrs, parent) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  const P = (x, y) => x.toFixed(4) + ',' + y.toFixed(4);

  function renderDrawing() {
    const m = state.model, d = m.design;
    svg.innerHTML = '';
    let xmax = d.length || 0, ymax = d.max_radius || 0;
    m.order.forEach(n => { const c = n.c; if (num(c.x1)) xmax = Math.max(xmax, c.x1); });
    const g = el('g', { id: 'parts' }, svg);
    const inners = [], bodies = [], fins = [];
    m.order.forEach(n => {
      const c = n.c, [grp] = kindOf(c);
      const common = { class: 'part', 'data-id': c.id, style: '--k:var(--k-' + grp + ')' };
      if (c.profile && c.profile.length > 1) {
        const top = c.profile.map(p => P(p[0], -p[1]));
        const bot = c.profile.slice().reverse().map(p => P(p[0], p[1]));
        const e = el('polygon', Object.assign({ points: top.concat(bot).join(' ') }, common));
        e.classList.add('body');
        bodies.push(e);
        ymax = Math.max(ymax, ...c.profile.map(p => p[1]));
      } else if (c.fins && c.fins.points && c.fins.points.length > 2) {
        const p = n.parent && n.parent.c;
        const r = (p && num(p.r_aft)) ? p.r_aft : (p && num(p.radius) ? p.radius : d.max_radius);
        const x0 = num(c.x0) ? c.x0 : 0;
        const pts = c.fins.points.map(q => [x0 + q[0], r + q[1]]);
        const gg = el('g', common);
        gg.classList.add('fin');
        el('polygon', { points: pts.map(q => P(q[0], -q[1])).join(' ') }, gg);
        el('polygon', { points: pts.map(q => P(q[0], q[1])).join(' ') }, gg);
        fins.push(gg);
        ymax = Math.max(ymax, ...pts.map(q => q[1]));
      } else if (num(c.x0) && num(c.x1) && c.kind !== 'stage') {
        const r = partRadius(n);
        const e = el('rect', Object.assign({ x: c.x0, y: -r, width: Math.max(c.x1 - c.x0, 0.002), height: 2 * r, rx: 0 }, common));
        e.classList.add('inner');
        if (num(c.inner_radius) && c.inner_radius < r) e.classList.add('hollow');
        inners.push(e);
        ymax = Math.max(ymax, r);
      }
    });
    bodies.forEach(e => g.appendChild(e));
    inners.forEach(e => g.appendChild(e));
    fins.forEach(e => g.appendChild(e));
    g.querySelectorAll('.part').forEach(e => {
      const c = m.byId.get(e.dataset.id).c;
      const t = el('title', {}); t.textContent = c.name + ' (' + c.label + ')'; e.insertBefore(t, e.firstChild);
    });
    // centreline
    el('line', { x1: -0.02 * xmax, y1: 0, x2: xmax * 1.02, y2: 0, class: 'axis' }, g);

    const pad = Math.max(0.04 * xmax, ymax * 0.2);
    if (state.orient === 'v') {
      g.setAttribute('transform', 'rotate(90)');   // (x,y) -> (-y, x): nose up
      svg.setAttribute('viewBox', [-(ymax + pad), -pad, 2 * (ymax + pad), xmax + 2 * pad].join(' '));
    } else {
      g.removeAttribute('transform');
      svg.setAttribute('viewBox', [-pad, -(ymax + pad), xmax + 2 * pad, 2 * (ymax + pad)].join(' '));
    }
    svg.setAttribute('preserveAspectRatio', 'xMidYMid meet');
    applySelectionToDrawing();

    const count = m.order.filter(n => n.c.kind !== 'stage').length;
    document.getElementById('drawHead').innerHTML =
      '<span><b>' + esc(d.name) + '</b> <span class="muted">(' + esc(d.file) + ')</span></span>' +
      '<span>Length <b>' + fmtLen(d.length) + '</b></span>' +
      '<span>Max diameter <b>' + fmtLen(2 * d.max_radius) + '</b></span>' +
      '<span><b>' + count + '</b> components</span>';
    const legend = document.getElementById('legend');
    const used = new Set(m.order.map(n => kindOf(n.c)[0]));
    legend.innerHTML = ['body', 'fin', 'struct', 'mass', 'reco', 'ext'].filter(k => used.has(k))
      .map(k => '<span style="--k:var(--k-' + k + ')">' + GROUP_LABEL[k] + '</span>').join('') +
      '<span class="note">Nose tip at left/top. Motor overhang not included.</span>';
  }

  function applySelectionToDrawing() {
    svg.classList.toggle('hasSel', !!state.selected);
    svg.querySelectorAll('.part').forEach(e => e.classList.toggle('selected', e.dataset.id === state.selected));
    const sel = svg.querySelector('.part.selected');
    if (sel) sel.parentNode.appendChild(sel);   // raise above neighbours
  }

  svg.addEventListener('click', e => { const p = e.target.closest('.part'); if (p) select(p.dataset.id, true); });
  svg.addEventListener('mouseover', e => { const p = e.target.closest('.part'); setHover(p ? p.dataset.id : null); });
  svg.addEventListener('mouseleave', () => setHover(null));

  // ---------- hover sync ----------
  let hoverId = null;
  function setHover(id) {
    if (id === hoverId) return;
    hoverId = id;
    treeEl.querySelectorAll('.node.hover').forEach(e => e.classList.remove('hover'));
    svg.querySelectorAll('.part.hover').forEach(e => e.classList.remove('hover'));
    if (!id) return;
    const row = treeEl.querySelector('.node[data-id="' + id + '"]'); if (row) row.classList.add('hover');
    const part = svg.querySelector('.part[data-id="' + id + '"]'); if (part) part.classList.add('hover');
  }

  // ---------- selection ----------
  function select(id, reveal) {
    const n = state.model.byId.get(id);
    if (!n) return;
    state.selected = id;
    if (reveal) {
      let p = n.parent, changed = false;
      while (p) { if (state.collapsed.has(p.c.id)) { state.collapsed.delete(p.c.id); changed = true; } p = p.parent; }
      if (changed) renderTree();
    }
    treeEl.querySelectorAll('.node').forEach(r => r.classList.toggle('selected', r.dataset.id === id));
    if (reveal) {
      const row = treeEl.querySelector('.node[data-id="' + id + '"]');
      if (row && row.scrollIntoView) row.scrollIntoView({ block: 'nearest' });
    }
    applySelectionToDrawing();
    renderDetails();
  }

  // ---------- details ----------
  function renderDetails() {
    const pane = document.getElementById('detailPane');
    const n = state.selected && state.model.byId.get(state.selected);
    if (!n) { pane.innerHTML = '<div class="placeholder">Select a component to see its details.</div>'; return; }
    const c = n.c, [grp, tag] = kindOf(c);
    const rows = [];
    const add = (k, v) => rows.push('<tr><td class="k">' + esc(k) + '</td><td class="v">' + v + '</td></tr>');
    if (c.kind === 'stage') {
      add('Overall length', fmtLen(c.length));
      add('Components', String(n.children.length) + ' body components, ' + (countDesc(n)) + ' total');
    } else {
      add('Starts at (from nose tip)', fmtLen(c.x0));
      add('Ends at', fmtLen(c.x1));
      add('Length', fmtLen(c.length));
      if (c.profile) {
        if (num(c.r_fore) && num(c.r_aft) && Math.abs(c.r_fore - c.r_aft) > 1e-9) {
          add('Fore diameter', fmtLen(2 * c.r_fore)); add('Aft diameter', fmtLen(2 * c.r_aft));
        } else add('Diameter', fmtLen(2 * (num(c.r_aft) ? c.r_aft : c.r_fore)));
        if (num(c.thickness)) add('Wall thickness', fmtLen(c.thickness, 3));
      } else if (c.fins) {
        const f = c.fins;
        add('Fin count', String(f.count));
        add('Root chord', fmtLen(f.root)); add('Tip chord', fmtLen(f.tip));
        add('Span', fmtLen(f.span)); add('Sweep', fmtLen(f.sweep));
        add('Thickness', fmtLen(f.thickness, 3));
        if (num(f.cant) && f.cant) add('Cant', f.cant.toFixed(2) + '°');
      } else {
        if (num(c.radius)) add('Outer diameter', fmtLen(2 * c.radius));
        else if (c.radius === 'auto') add('Outer diameter', '<span class="muted">auto (fits parent)</span>');
        if (num(c.inner_radius)) add('Inner diameter', fmtLen(2 * c.inner_radius));
      }
      if (c.offset) add('Positioned', esc(c.offset.method) + ' of parent' + (c.offset.value ? ', offset ' + fmtLen(c.offset.value) : ''));
    }
    add('Mass', fmtMassLong(c.mass));

    const fields = c.fields || {};
    const fieldRows = Object.keys(fields).map(k => '<tr><td class="k mono">' + esc(k) + '</td><td class="v mono">' + esc(fields[k]) + '</td></tr>').join('');

    const chain = [];
    for (let p = n; p; p = p.parent) chain.unshift(p);
    const crumbs = chain.map((p, i) => i === chain.length - 1
      ? '<span class="here">' + esc(p.c.name) + '</span>'
      : '<a data-id="' + p.c.id + '">' + esc(p.c.name) + '</a>').join('<span class="sep">›</span>');

    pane.innerHTML =
      '<h2>' + esc(c.name) + '</h2>' +
      '<div class="kindline"><span class="tag" style="display:inline-block;--k:var(--k-' + grp + ');color:#fff;background:var(--k);font-size:10px;font-weight:700;padding:3px 4px;border-radius:4px">' + tag + '</span> ' +
      '<span class="muted">' + esc(c.label) + '</span></div>' +
      '<h3>Resolved</h3><div class="card"><table class="resolved">' + rows.join('') + '</table></div>' +
      '<h3>OpenRocket fields <span class="muted" style="text-transform:none;letter-spacing:0">(raw, SI)</span></h3>' +
      (fieldRows ? '<table>' + fieldRows + '</table>' : '<div class="muted">none</div>') +
      '<h3>Path</h3><div class="crumbs">' + crumbs + '</div>';
    pane.querySelectorAll('.crumbs a').forEach(a => a.addEventListener('click', () => select(a.dataset.id, true)));
    pane.scrollTop = 0;
  }
  function countDesc(n) { let k = 0; (function w(x) { x.children.forEach(y => { k++; w(y); }); })(n); return k; }

  // ---------- controls ----------
  const designSel = document.getElementById('designSel');
  KEYS.forEach(k => {
    const o = document.createElement('option');
    o.value = k;
    o.textContent = k + (DATA[k].name && DATA[k].name !== k && DATA[k].name.toLowerCase() !== k.toLowerCase() ? ' (' + DATA[k].name + ')' : '');
    designSel.appendChild(o);
  });
  designSel.addEventListener('change', () => setDesign(designSel.value));

  function setDesign(key) {
    state.key = key;
    designSel.value = key;
    state.model = buildModel(DATA[key]);
    state.selected = null;
    state.collapsed = new Set();
    hoverId = null;
    renderTree();
    renderDrawing();
    renderDetails();
  }

  document.getElementById('unitSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.units = b.dataset.u;
    e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderTree(); renderDrawing(); renderDetails();
  });
  document.getElementById('orientSeg').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.orient = b.dataset.o;
    e.currentTarget.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b));
    renderDrawing();
  });
  document.getElementById('expandAll').addEventListener('click', () => { state.collapsed.clear(); renderTree(); });
  document.getElementById('collapseAll').addEventListener('click', () => {
    state.model.order.forEach(n => { if (n.children.length && n.c.kind !== 'stage') state.collapsed.add(n.c.id); });
    renderTree();
  });
  document.getElementById('search').addEventListener('input', e => { state.query = e.target.value; renderTree(); });

  setDesign(KEYS[0]);

  // small API for tests / embedding
  window.vehicleExplorer = { state, setDesign, select, renderTree, renderDrawing, keys: KEYS };
})();
</script>
</body>
</html>
