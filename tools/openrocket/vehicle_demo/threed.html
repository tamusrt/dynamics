<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vehicle 3D viewer</title>
<meta name="description" content="Spin the team's rockets around in 3D. Geometry pre-parsed from the OpenRocket designs; rendered in the browser with three.js.">
<style>
  :root { color-scheme: light dark; --bg:#fff; --fg:#1f2328; --muted:#59636e; --card:#f6f8fa; --line:#d0d7de; --accent:#0969da;
          --scene:#eef1f5; --grid-major:#b9c1cb; --grid-minor:#d8dde3; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --accent:#58a6ff;
          --scene:#11161d; --grid-major:#3a424c; --grid-minor:#232a33; }
  }
  :root[data-theme="dark"] { --bg:#0d1117; --fg:#e6edf3; --muted:#9198a1; --card:#161b22; --line:#30363d; --accent:#58a6ff;
          --scene:#11161d; --grid-major:#3a424c; --grid-minor:#232a33; }
  html, body { margin:0; height:100%; }
  body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; color:var(--fg); background:var(--bg); overflow:hidden; }
  #stage { position:fixed; inset:0; background:var(--scene); }
  #stage canvas { display:block; }
  #panel { position:fixed; top:16px; left:16px; width:280px; max-width:calc(100vw - 32px); box-sizing:border-box;
           background:var(--card); border:1px solid var(--line); border-radius:8px; padding:12px 14px;
           box-shadow:0 2px 10px rgba(0,0,0,.10); }
  #panel h1 { font-size:15px; font-weight:600; margin:0 0 10px; }
  #panel label { display:block; margin:6px 0; }
  #panel select { width:100%; margin-top:3px; font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 8px; }
  .row { display:flex; gap:14px; flex-wrap:wrap; }
  .row label { display:inline-flex; align-items:center; gap:5px; margin:4px 0; }
  button { font:inherit; color:var(--fg); background:var(--bg); border:1px solid var(--line); border-radius:6px; padding:5px 10px; cursor:pointer; margin-top:4px; }
  button:hover { border-color:var(--accent); }
  dl.stats { display:grid; grid-template-columns:auto 1fr; gap:2px 10px; margin:10px 0 0; padding-top:10px; border-top:1px solid var(--line); }
  dl.stats dt { color:var(--muted); }
  dl.stats dd { margin:0; font-variant-numeric:tabular-nums; }
  #sel { margin-top:10px; padding-top:10px; border-top:1px solid var(--line); min-height:3.4em; }
  #sel .name { font-weight:600; }
  #sel .name::before { content:""; display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--accent); margin-right:6px; }
  .muted { color:var(--muted); }
  .hint { color:var(--muted); font-size:12.5px; margin:8px 0 0; }
  #msg { position:fixed; inset:0; display:grid; place-items:center; padding:24px; text-align:center; color:var(--fg); background:var(--bg); }
  #msg[hidden] { display:none; }
  #msg div { max-width:30em; }
</style>
<script type="importmap">
{ "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="stage"></div>

<div id="panel">
  <h1>Vehicle 3D viewer</h1>
  <label>Design
    <select id="design"></select>
  </label>
  <div class="row">
    <label><input type="checkbox" id="internals"> Show internals</label>
    <label><input type="checkbox" id="wire"> Wireframe</label>
  </div>
  <button id="orient" type="button">Stand upright</button>
  <dl class="stats">
    <dt>Length</dt><dd id="len">–</dd>
    <dt>Max diameter</dt><dd id="dia">–</dd>
  </dl>
  <div id="sel"><span class="muted">Click a part to inspect it.</span></div>
  <p class="hint">Drag to orbit · scroll to zoom · right-drag to pan</p>
</div>

<script id="prep">
function makeRocketPrep(THREE) {
  const BODY = new Set(['nosecone', 'bodytube', 'transition']);
  const FINS = new Set(['trapezoidfinset', 'ellipticalfinset', 'freeformfinset']);
  const NO_GEOMETRY = new Set(['stage', 'boosterset', 'podset', 'parallelstage', 'tubefinset']);
  const LATHE_SEGMENTS = 64;
  const CYL_SEGMENTS = 32;

  const isNum = v => typeof v === 'number' && Number.isFinite(v);

  // Model frame: rocket axis along +X, nose tip at x = L, tail at x = 0, y/z radial.
  // Data: x measured from the nose tip, aft positive. So model x = L - data x.

  // profile [[x, r], ...] nose -> tail  ->  Vector2(r, modelX) with modelX increasing (tail -> nose),
  // which gives LatheGeometry outward-facing normals. Optional flat caps close open ends.
  function lathePoints(profile, L, { capAft = false, capFore = false } = {}) {
    const pts = [];
    const push = (r, y) => {
      const last = pts[pts.length - 1];
      if (last && Math.abs(last.x - r) < 1e-9 && Math.abs(last.y - y) < 1e-9) return;
      pts.push(new THREE.Vector2(r, y));
    };
    const rev = profile.slice().reverse();
    if (capAft && rev[0][1] > 0) push(0, L - rev[0][0]);
    for (const [x, r] of rev) push(Math.max(0, r), L - x);
    const end = rev[rev.length - 1];
    if (capFore && end[1] > 0) push(0, L - end[0]);
    return pts;
  }

  function bodyGeometry(profile, L, caps) {
    const g = new THREE.LatheGeometry(lathePoints(profile, L, caps), LATHE_SEGMENTS);
    g.rotateZ(-Math.PI / 2);            // lathe axis Y -> rocket axis X
    g.computeBoundingBox();
    return g;
  }

  // Planform [[x_rel, y], ...]: x_rel aft of the fin set's x0, y outward from the parent tube surface (rSurf).
  function finShape(points, x0, rSurf, L) {
    const shape = new THREE.Shape();
    points.forEach(([xr, y], i) => {
      const px = L - (x0 + xr), py = rSurf + y;
      if (i === 0) shape.moveTo(px, py); else shape.lineTo(px, py);
    });
    shape.closePath();
    return shape;
  }

  function finGeometry(fins, x0, rSurf, L) {
    const t = Math.max(isNum(fins.thickness) ? fins.thickness : 0.003, 0.0005);
    const g = new THREE.ExtrudeGeometry(finShape(fins.points, x0, rSurf, L), { depth: t, bevelEnabled: false, steps: 1 });
    g.translate(0, 0, -t / 2);          // centre the thickness on the fin's plane
    g.computeBoundingBox();
    return g;
  }

  function cylinderGeometry(radius, x0, x1, L) {
    const len = Math.max(x1 - x0, 0.001);
    const g = new THREE.CylinderGeometry(radius, radius, len, CYL_SEGMENTS, 1);
    g.rotateZ(-Math.PI / 2);
    g.translate(L - (x0 + x1) / 2, 0, 0);
    g.computeBoundingBox();
    return g;
  }

  // Returns { parts: [...], bbox: THREE.Box3, notes: [...] } for one design.
  // Each part: { id, name, kind, label, role: 'nose'|'body'|'fin'|'internal', length, mass, geometry, angles: [rotX, ...] }
  function buildModel(design) {
    const L = design.length;
    const comps = design.components;
    const byId = new Map(comps.map(c => [c.id, c]));
    const bodies = comps.filter(c => BODY.has(c.kind) && Array.isArray(c.profile) && c.profile.length >= 2);
    const foreMost = bodies.reduce((a, c) => (!a || c.x0 < a.x0 ? c : a), null);
    const aftMost = bodies.reduce((a, c) => (!a || c.x1 > a.x1 ? c : a), null);
    const parts = [], notes = [];
    let radial = design.max_radius || 0;

    const surfaceRadius = c => {
      const p = byId.get(c.parent);
      if (p && isNum(p.r_aft)) return p.r_aft;
      notes.push(c.name + ': parent radius unknown, using design max radius');
      return design.max_radius;
    };

    for (const c of comps) {
      if (NO_GEOMETRY.has(c.kind)) continue;
      const base = { id: c.id, name: c.name, kind: c.kind, label: c.label || c.kind, mass: isNum(c.mass) ? c.mass : null, angles: [0] };

      if (BODY.has(c.kind)) {
        if (!Array.isArray(c.profile) || c.profile.length < 2) { notes.push(c.name + ': no profile'); continue; }
        const geometry = bodyGeometry(c.profile, L, { capAft: c === aftMost, capFore: c === foreMost });
        parts.push({ ...base, role: c.kind === 'nosecone' ? 'nose' : 'body', length: c.x1 - c.x0, geometry });
        for (const pr of c.profile) radial = Math.max(radial, pr[1]);

      } else if (FINS.has(c.kind)) {
        const f = c.fins;
        if (!f || !Array.isArray(f.points) || f.points.length < 3) { notes.push(c.name + ': no planform'); continue; }
        const rSurf = surfaceRadius(c);
        const count = Math.max(1, Math.round(isNum(f.count) ? f.count : 1));
        const angles = Array.from({ length: count }, (_, i) => Math.PI / count + i * 2 * Math.PI / count);
        parts.push({ ...base, role: 'fin', length: isNum(f.root) ? f.root : c.x1 - c.x0, geometry: finGeometry(f, c.x0, rSurf, L), angles });
        for (const pt of f.points) radial = Math.max(radial, rSurf + pt[1]);

      } else {
        // internal part: translucent cylinder from x0..x1 at its radius
        let r = c.radius;
        const p = byId.get(c.parent);
        const pr = p && isNum(p.r_aft) ? p.r_aft : design.max_radius;
        if (!isNum(r)) { r = pr * 0.95; notes.push(c.name + ': radius "' + c.radius + '" resolved to 95% of parent radius'); }
        if (r > pr + 1e-6) notes.push(c.name + ': radius ' + r.toFixed(4) + ' m exceeds its tube (' + pr.toFixed(4) + ' m); drawn just inside');
        r = Math.min(r, pr - 0.0003);   // keep internals just inside the shell so they never z-fight with it
        if (!(r > 0)) { notes.push(c.name + ': non-positive radius, skipped'); continue; }
        if (!isNum(c.x0) || !isNum(c.x1)) { notes.push(c.name + ': no axial extent, skipped'); continue; }
        parts.push({ ...base, role: 'internal', length: c.x1 - c.x0, geometry: cylinderGeometry(r, c.x0, c.x1, L) });
      }
    }

    const bbox = new THREE.Box3(new THREE.Vector3(0, -radial, -radial), new THREE.Vector3(L, radial, radial));
    return { parts, bbox, notes };
  }

  return { buildModel, lathePoints, finShape, finGeometry, bodyGeometry, cylinderGeometry };
}
</script>

<script type="module">
const msgEl = document.getElementById('msg');
const showMessage = text => { msgEl.firstElementChild.textContent = text; msgEl.hidden = false; };

function webglAvailable() {
  try {
    const c = document.createElement('canvas');
    return !!(window.WebGLRenderingContext && (c.getContext('webgl2') || c.getContext('webgl')));
  } catch (e) { return false; }
}

if (!webglAvailable()) {
  showMessage('This viewer needs WebGL, which your browser or device has disabled. Try a current Chrome, Firefox, Edge or Safari with hardware acceleration on.');
} else {
  let THREE, OrbitControls;
  try {
    THREE = await import('three');
    ({ OrbitControls } = await import('https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js'));
  } catch (e) {
    showMessage('Could not load three.js from the CDN. This page needs an internet connection the first time it opens.');
  }
  if (THREE) main(THREE, OrbitControls);
}

function main(THREE, OrbitControls) {
  const designs = JSON.parse(document.getElementById('geometry').textContent);
  const prep = makeRocketPrep(THREE);
  const stage = document.getElementById('stage');
  const ui = {
    design: document.getElementById('design'), internals: document.getElementById('internals'), wire: document.getElementById('wire'),
    orient: document.getElementById('orient'), len: document.getElementById('len'), dia: document.getElementById('dia'), sel: document.getElementById('sel'),
  };
  const cssVar = name => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

  // --- renderer, scene, camera, controls -----------------------------------
  let renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true });
  } catch (e) {
    showMessage('WebGL could not be started: ' + e.message);
    return;
  }
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(stage.clientWidth, stage.clientHeight);
  stage.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  const camera = new THREE.PerspectiveCamera(40, stage.clientWidth / stage.clientHeight, 0.01, 100);
  const controls = new OrbitControls(camera, renderer.domElement);
  controls.enableDamping = true;
  controls.dampingFactor = 0.08;
  controls.minDistance = 0.05;

  scene.add(new THREE.HemisphereLight(0xffffff, 0x8a94a0, 1.5));
  const key = new THREE.DirectionalLight(0xffffff, 2.2);
  key.position.set(3, 5, 4);
  scene.add(key);
  const fill = new THREE.DirectionalLight(0xffffff, 0.7);
  fill.position.set(-4, 1, -3);
  scene.add(fill);

  // --- materials -----------------------------------------------------------
  const BASE_COLORS = { body: '#d6dade', nose: '#e8ebef', fin: '#99a3ae', internal: '#6f9fe0' };
  const makeMaterial = role => {
    const m = new THREE.MeshStandardMaterial({ color: BASE_COLORS[role], roughness: 0.55, metalness: 0.05 });
    if (role === 'internal') { m.transparent = true; m.opacity = 0.35; m.depthWrite = false; }
    else m.side = THREE.DoubleSide;   // body lathes are open shells; render their insides too
    return m;
  };

  // --- state ---------------------------------------------------------------
  const rocket = new THREE.Group();
  const externalsGroup = new THREE.Group();
  const internalsGroup = new THREE.Group();
  rocket.add(externalsGroup, internalsGroup);
  scene.add(rocket);
  let grid = null, meshes = [], selected = null, vertical = false;

  function disposeGroup(g) {
    for (const child of [...g.children]) {
      child.traverse(o => { if (o.geometry) o.geometry.dispose(); if (o.material) o.material.dispose(); });
      g.remove(child);
    }
  }

  function loadDesign(name) {
    const design = designs[name];
    disposeGroup(externalsGroup); disposeGroup(internalsGroup);
    meshes = []; selected = null;
    const { parts, notes } = prep.buildModel(design);
    if (notes.length) console.info('[' + name + '] geometry notes:\n  ' + notes.join('\n  '));
    for (const part of parts) {
      for (const angle of part.angles) {
        const mesh = new THREE.Mesh(part.geometry, makeMaterial(part.role));
        mesh.name = part.name;
        mesh.rotation.x = angle;
        mesh.userData.part = part;
        mesh.material.wireframe = ui.wire.checked;
        (part.role === 'internal' ? internalsGroup : externalsGroup).add(mesh);
        meshes.push(mesh);
      }
    }
    internalsGroup.visible = ui.internals.checked;
    ui.len.textContent = fmtLength(design.length);
    ui.dia.textContent = fmtDiameter(2 * design.max_radius);
    renderSelection();
    applyOrientation();
    fitCamera();
  }

  function applyOrientation() {
    rocket.rotation.z = vertical ? Math.PI / 2 : 0;
    ui.orient.textContent = vertical ? 'Lay flat' : 'Stand upright';
    rocket.updateMatrixWorld(true);
    buildGrid();
  }

  function buildGrid() {
    if (grid) { scene.remove(grid); grid.geometry.dispose(); grid.material.dispose(); grid = null; }
    const box = new THREE.Box3().setFromObject(rocket);
    if (box.isEmpty()) return;
    const extent = Math.max(box.max.x - box.min.x, box.max.z - box.min.z, box.max.y - box.min.y);
    const size = Math.ceil(extent * 1.6 / 0.5) * 0.5;
    grid = new THREE.GridHelper(size, Math.round(size / 0.25), cssVar('--grid-major'), cssVar('--grid-minor'));
    grid.material.transparent = true;
    grid.material.opacity = 0.9;
    grid.position.set((box.min.x + box.max.x) / 2, box.min.y - 0.005, (box.min.z + box.max.z) / 2);
    scene.add(grid);
  }

  function fitCamera() {
    const box = new THREE.Box3().setFromObject(rocket);
    if (box.isEmpty()) return;
    const sphere = box.getBoundingSphere(new THREE.Sphere());
    const vfov = THREE.MathUtils.degToRad(camera.fov);
    const hfov = 2 * Math.atan(Math.tan(vfov / 2) * camera.aspect);
    const dist = sphere.radius / Math.sin(Math.min(vfov, hfov) / 2) * 1.08;
    const dir = (vertical ? new THREE.Vector3(1, 0.35, 1.2) : new THREE.Vector3(0.45, 0.55, 1.2)).normalize();
    camera.position.copy(sphere.center).addScaledVector(dir, dist);
    camera.near = dist / 500; camera.far = dist * 50;
    camera.updateProjectionMatrix();
    controls.target.copy(sphere.center);
    controls.maxDistance = dist * 8;
    controls.update();
  }

  // --- theme ---------------------------------------------------------------
  function applyTheme() {
    scene.background = new THREE.Color(cssVar('--scene'));
    buildGrid();
    tintSelection();
  }
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', applyTheme);

  // --- selection -----------------------------------------------------------
  function tintSelection() {
    const accent = cssVar('--accent');
    for (const m of meshes) {
      const isSel = selected && m.userData.part === selected;
      m.material.color.set(isSel ? accent : BASE_COLORS[m.userData.part.role]);
      m.material.emissive.set(isSel ? accent : '#000000');
      m.material.emissiveIntensity = isSel ? 0.15 : 0;
      if (m.userData.part.role === 'internal') m.material.opacity = isSel ? 0.7 : 0.35;
    }
  }
  function renderSelection() {
    tintSelection();
    if (!selected) { ui.sel.innerHTML = '<span class="muted">Click a part to inspect it.</span>'; return; }
    const p = selected;
    const rows = ['<div class="name">' + esc(p.name) + '</div>',
                  '<div class="muted">' + esc(p.label) + (p.role === 'internal' ? ' (internal)' : '') + '</div>',
                  '<div>Length ' + fmtLength(p.length) + '</div>'];
    if (p.mass != null) rows.push('<div>Mass ' + fmtMass(p.mass) + '</div>');
    ui.sel.innerHTML = rows.join('');
  }

  const raycaster = new THREE.Raycaster();
  const ndc = new THREE.Vector2();
  function pick(ev) {
    const rect = renderer.domElement.getBoundingClientRect();
    ndc.set(((ev.clientX - rect.left) / rect.width) * 2 - 1, -((ev.clientY - rect.top) / rect.height) * 2 + 1);
    raycaster.setFromCamera(ndc, camera);
    const pickables = meshes.filter(m => m.userData.part.role !== 'internal' || internalsGroup.visible);
    const hit = raycaster.intersectObjects(pickables, false)[0];
    return hit ? hit.object : null;
  }
  let downAt = null;
  renderer.domElement.addEventListener('pointerdown', ev => { downAt = [ev.clientX, ev.clientY]; });
  renderer.domElement.addEventListener('pointerup', ev => {
    if (!downAt || ev.button !== 0) { downAt = null; return; }
    const moved = Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]);
    downAt = null;
    if (moved > 4) return;
    const hit = pick(ev);
    selected = hit ? hit.userData.part : null;
    renderSelection();
  });
  renderer.domElement.addEventListener('pointermove', ev => {
    if (downAt) return;
    renderer.domElement.style.cursor = pick(ev) ? 'pointer' : '';
  });

  // --- ui wiring -----------------------------------------------------------
  for (const name of Object.keys(designs)) {
    const opt = document.createElement('option');
    opt.value = name; opt.textContent = name;
    ui.design.appendChild(opt);
  }
  ui.design.addEventListener('change', () => loadDesign(ui.design.value));
  ui.internals.addEventListener('change', () => { internalsGroup.visible = ui.internals.checked; });
  ui.wire.addEventListener('change', () => { for (const m of meshes) m.material.wireframe = ui.wire.checked; });
  ui.orient.addEventListener('click', () => { vertical = !vertical; applyOrientation(); fitCamera(); });

  window.addEventListener('resize', () => {
    const w = stage.clientWidth, h = stage.clientHeight;
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(w, h);
  });

  // --- formatting ----------------------------------------------------------
  function fmtLength(m) { return (m / 0.0254).toFixed(1) + ' in (' + Math.round(m * 1000) + ' mm)'; }
  function fmtDiameter(m) { return (m / 0.0254).toFixed(2) + ' in (' + (m * 1000).toFixed(1) + ' mm)'; }
  function fmtMass(kg) { return kg < 1 ? Math.round(kg * 1000) + ' g' : kg.toFixed(2) + ' kg'; }
  function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

  // --- go ------------------------------------------------------------------
  applyTheme();
  loadDesign(ui.design.value);
  renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); });
}
</script>
</body>
</html>
